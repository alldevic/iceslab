# The panel's response security headers, in ONE place.
#
# nginx does not merge `add_header`: a location that declares any add_header
# of its own drops every one inherited from the server block. Three locations
# here declare their own (they set caching), and each used to re-type the list
# by hand — with the result that the Content-Security-Policy line, the only one
# that matters for an HTML document, was re-typed in none of them. It was
# therefore sent on the API's JSON and on nothing else: `/`, `/index.html` and
# every SPA route (which try_files rewrites to `/index.html`) answered without
# it, so the report-only policy it ships in produced no reports anywhere, and
# an operator reading an empty console would conclude the policy fits and turn
# on enforcement.
#
# `$csp` is set in the server block, which is also where this is included.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy-Report-Only $csp always;
