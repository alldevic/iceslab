name: Core release

# Our own build of an upstream core, published as a release of this repository
# that the node installers pin by sha256. Today: sing-box with the official
# build tags PLUS with_v2ray_api, which the official binaries lack and without
# which the agent has no per-user traffic counters on sing-box protocols.
#
# Started BY HAND on main (Actions -> Core release -> Run workflow, or
# `gh workflow run cores.yml --ref main -f core=singbox -f version=1.13.14`),
# not by pushing a tag:
#   - the signing key sits in the `release` environment, which only main may
#     use; a tag push would run in the tag's context and never get the key;
#   - so the code that signs is always the code on main, as with release.yml;
#   - the release and its tag (core-singbox-v<version>) are made here, on the
#     main commit that built them.
# The owner approves the signing step, as on every release.
#
# What is built is fixed below, per version: the upstream commit the release
# tag points at, the Go the official binaries were built with, and the arches
# the node installer pins. A version not in the table is refused.
#
# ⚠ Never "Latest": the panel's update hint reads /releases/latest, and a core
# release there would tell every panel to "update" to it.
on:
  workflow_dispatch:
    inputs:
      core:
        description: Core to build
        type: choice
        options: [singbox]
      version:
        description: Upstream version, e.g. 1.13.14
        type: string
        required: true

permissions: {}

concurrency:
  group: core-release-${{ inputs.core }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  CORE: ${{ inputs.core }}
  VERSION: ${{ inputs.version }}

jobs:
  plan:
    name: what to build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
      go: ${{ steps.pin.outputs.go }}
      tag: ${{ steps.pin.outputs.tag }}
    steps:
      - name: Pinned source and toolchain
        id: pin
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::run this from main: the signing key is only given to main"
            exit 1
          fi
          # version -> upstream commit of its release tag, and the Go the
          # official release was built with (its `sing-box version` says so).
          case "$CORE/$VERSION" in
            singbox/1.13.14) commit=25a600db24f7680ad9806ce5427bd0ab8afe1114; go=1.25.11 ;;
            *) echo "::error::$CORE $VERSION is not in the table in cores.yml"; exit 1 ;;
          esac
          {
            echo "commit=$commit"
            echo "go=$go"
            echo "tag=core-$CORE-v$VERSION"
          } >> "$GITHUB_OUTPUT"

  build:
    name: sing-box ${{ inputs.version }} (linux/${{ matrix.arch }})
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The variant of each official tarball the installer pins today:
          # amd64 and arm64 are the "purego" build (naive outbound loaded at
          # run time, CGO off), armv7 the plain one without naive. Ours is the
          # same build plus with_v2ray_api.
          - { arch: amd64, goarch: amd64, goarm: '', tagfile: DEFAULT_BUILD_TAGS, extra: 'with_purego', official_sha: f48703461a15476951ac4967cdad339d986f4b8096b4eb3ff0829a500502d697 }
          - { arch: arm64, goarch: arm64, goarm: '', tagfile: DEFAULT_BUILD_TAGS, extra: 'with_purego', official_sha: 4742df6a4314e8ecc41736849fca6d73b8f9e91b6e8b06ee794ff17ba180579e }
          - { arch: armv7, goarch: arm, goarm: '7', tagfile: DEFAULT_BUILD_TAGS_OTHERS, extra: '', official_sha: e01a58d28512b1447ab6156017afdeeaa306169a95d27abc00e112599e4ae46c }
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      ARCH: ${{ matrix.arch }}
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: '0'
      GOFLAGS: -mod=readonly
    steps:
      # By the release TAG, not the bare commit: Go stamps the main module's
      # version from a tag on HEAD, and without the tag in the checkout it
      # writes a pseudo-version (v0.0.0-20260625083607-25a600db24f7) where the
      # official binary has v1.13.14. That one line was the whole difference
      # from the official build (sandbox, 2026-10-22). The next step holds
      # the tag to the pinned commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SagerNet/sing-box
          ref: v${{ inputs.version }}
          path: upstream
          persist-credentials: false

      # The commit is the one the upstream release tag names today. A tag that
      # moved upstream is a reason to stop, not to build the new commit.
      - name: Upstream tag still names the pinned commit
        run: |
          set -euo pipefail
          head=$(git -C upstream rev-parse HEAD)
          [ "$head" = "$COMMIT" ] || { echo "::error::checked out $head, want $COMMIT"; exit 1; }
          refs=$(git ls-remote https://github.com/SagerNet/sing-box.git "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}")
          tagged=$(awk '/\^\{\}$/ {print $1}' <<<"$refs")
          [ -n "$tagged" ] || tagged=$(awk '{print $1}' <<<"$refs" | head -1)
          if [ "$tagged" != "$COMMIT" ]; then
            echo "::error::upstream v$VERSION now names ${tagged:-nothing}, the table says $COMMIT"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.plan.outputs.go }}
          cache: false

      # The official build line (upstream .github/workflows/build.yml):
      #   go build -v -trimpath -o dist/sing-box -tags "$BUILD_TAGS"
      #     -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=$V' $(cat release/LDFLAGS) -s -w -buildid="
      #     ./cmd/sing-box
      # built twice with the build cache cleared, ours with with_v2ray_api.
      # Then the same line WITHOUT it, compared with the binary inside the
      # official tarball: if those match byte for byte, ours differs from the
      # official release by the one tag and nothing else.
      - name: Build
        working-directory: upstream
        env:
          TAGFILE: ${{ matrix.tagfile }}
          EXTRA: ${{ matrix.extra }}
          OFFICIAL_SHA: ${{ matrix.official_sha }}
        run: |
          set -euo pipefail
          official_tags=$(tr -d '\n' < "release/$TAGFILE")${EXTRA:+,$EXTRA}
          ours_tags="$official_tags,with_v2ray_api"
          ldflags="-X 'github.com/sagernet/sing-box/constant.Version=$VERSION' $(cat release/LDFLAGS) -s -w -buildid="
          build() {
            go clean -cache
            mkdir -p "$1"
            go build -trimpath -o "$1/sing-box" -tags "$2" -ldflags "$ldflags" ./cmd/sing-box
          }
          go mod download
          build "$RUNNER_TEMP/a" "$ours_tags"
          build "$RUNNER_TEMP/b" "$ours_tags"
          a=$(sha256sum < "$RUNNER_TEMP/a/sing-box" | cut -d' ' -f1)
          b=$(sha256sum < "$RUNNER_TEMP/b/sing-box" | cut -d' ' -f1)
          if [ "$a" != "$b" ]; then
            echo "::error::two builds of one tree differ: $a vs $b"
            exit 1
          fi

          build "$RUNNER_TEMP/parity" "$official_tags"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/official.tar.gz" \
            "https://github.com/SagerNet/sing-box/releases/download/v$VERSION/sing-box-$VERSION-linux-$ARCH.tar.gz"
          echo "$OFFICIAL_SHA  $RUNNER_TEMP/official.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/official"
          tar -xzf "$RUNNER_TEMP/official.tar.gz" -C "$RUNNER_TEMP/official"
          official=$(sha256sum < "$(find "$RUNNER_TEMP/official" -type f -name sing-box)" | cut -d' ' -f1)
          parity=$(sha256sum < "$RUNNER_TEMP/parity/sing-box" | cut -d' ' -f1)
          {
            echo "### sing-box $VERSION linux/$ARCH"
            echo ""
            echo "- go $(go env GOVERSION), upstream $COMMIT"
            echo "- ours: tags \`$ours_tags\`, sha256 \`$a\`, the same on a second build"
            echo "- official tags, built here: \`$parity\`; official release binary: \`$official\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$parity" != "$official" ]; then
            echo "::error::the official tags built here do not give the official binary: ours would differ by more than with_v2ray_api"
            off_bin=$(find "$RUNNER_TEMP/official" -type f -name sing-box)
            echo "== official"; go version -m "$off_bin"; stat -c '%s bytes' "$off_bin"
            echo "== built here"; go version -m "$RUNNER_TEMP/parity/sing-box"; stat -c '%s bytes' "$RUNNER_TEMP/parity/sing-box"
            echo "== first differing bytes"; cmp -l "$off_bin" "$RUNNER_TEMP/parity/sing-box" | head -20 || true
            echo "== differing byte count: $(cmp -l "$off_bin" "$RUNNER_TEMP/parity/sing-box" | wc -l || true)"
            exit 1
          fi
          echo "- parity: identical, ours = official + with_v2ray_api" >> "$GITHUB_STEP_SUMMARY"
          echo "OURS_TAGS=$ours_tags" >> "$GITHUB_ENV"

      # The tags as the binary itself records them, for every arch (the
      # runner can execute only amd64).
      - name: The binary carries with_v2ray_api
        run: |
          set -euo pipefail
          recorded=$(go version -m "$RUNNER_TEMP/a/sing-box" | awk '$1 == "build" && $2 ~ /^-tags=/ {sub(/^-tags=/, "", $2); print $2}')
          echo "recorded tags: $recorded"
          [ "$recorded" = "$OURS_TAGS" ] || { echo "::error::recorded $recorded, built with $OURS_TAGS"; exit 1; }
          case ",$recorded," in *,with_v2ray_api,*) ;; *) echo "::error::no with_v2ray_api"; exit 1 ;; esac

      # amd64 only: what an operator will see, and a config with v2ray_api
      # that ours loads and the official binary refuses.
      - name: sing-box version and check
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/a/sing-box" version
          cat > "$RUNNER_TEMP/v2api.json" <<'EOF'
          {
            "log": { "level": "warn" },
            "experimental": {
              "v2ray_api": {
                "listen": "127.0.0.1:10085",
                "stats": { "enabled": true, "inbounds": ["in"], "users": ["u-1"] }
              }
            },
            "inbounds": [
              { "type": "vless", "tag": "in", "listen": "127.0.0.1", "listen_port": 10443,
                "users": [ { "name": "u-1", "uuid": "5f0c9a3e-2b7d-4e51-9c8a-1d2e3f4a5b6c" } ] }
            ],
            "outbounds": [ { "type": "direct", "tag": "direct" } ]
          }
          EOF
          "$RUNNER_TEMP/a/sing-box" check -c "$RUNNER_TEMP/v2api.json"
          echo "ours: check passed"
          official=$(find "$RUNNER_TEMP/official" -type f -name sing-box)
          if out=$("$official" check -c "$RUNNER_TEMP/v2api.json" 2>&1); then
            echo "::error::the official binary accepted v2ray_api, so this build would not be needed"
            exit 1
          fi
          echo "official: refused, as expected: $out"

      # Packed so the archive is the same bytes on every run, because its
      # sha256 is what the installer pins: fixed order, owner and mtime, and
      # gzip without a name or timestamp.
      - name: Pack
        run: |
          set -euo pipefail
          name="sing-box-$VERSION-iceslab-linux-$ARCH"
          mkdir -p "$RUNNER_TEMP/pack/$name" "$RUNNER_TEMP/dist"
          install -m 0755 "$RUNNER_TEMP/a/sing-box" "$RUNNER_TEMP/pack/$name/sing-box"
          install -m 0644 upstream/LICENSE "$RUNNER_TEMP/pack/$name/LICENSE"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "$RUNNER_TEMP/pack" -cf - "$name" \
            | gzip -n -9 > "$RUNNER_TEMP/dist/$name.tar.gz"
          sha256sum "$RUNNER_TEMP/dist/$name.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 3

  sign:
    name: checksums, signature, provenance
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/agent-keys
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: core-*
          path: dist
          merge-multiple: true

      # The same key and the same shape as release.yml: raw ed25519 over
      # SHA256SUMS, checked against the public key the agent trusts.
      - name: Checksums and signature
        env:
          AGENT_SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
        working-directory: dist
        run: |
          set -euo pipefail
          if [ -z "$AGENT_SIGNING_KEY" ]; then
            echo "::error::AGENT_SIGNING_KEY is not set in the release environment"
            exit 1
          fi
          sha256sum ./*.tar.gz | sed 's# \./# #' > SHA256SUMS
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$AGENT_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS -out SHA256SUMS.sig
          rm -f "$key"
          [ "$(stat -c %s SHA256SUMS.sig)" = 64 ] || { echo "::error::not a 64-byte ed25519 signature"; exit 1; }
          openssl pkeyutl -verify -pubin -inkey "$GITHUB_WORKSPACE/.github/agent-keys/primary.pub" \
            -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig
          {
            echo "### checksums"
            echo ""
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-release
          path: dist/
          if-no-files-found: error
          retention-days: 3

  release:
    name: GitHub release
    needs: [plan, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      GO_VERSION: ${{ needs.plan.outputs.go }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-release
          path: dist

      # A core release is pinned by its sha256 and is never rebuilt in place:
      # if the tag exists, stop, and change the version table instead.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists; a published core is not replaced"
            exit 1
          fi
          {
            echo "sing-box $VERSION built from upstream commit \`$COMMIT\` (the v$VERSION release tag) with Go $GO_VERSION: the official build tags plus \`with_v2ray_api\`, which the official binaries lack and the agent needs for per-user traffic counters."
            echo ""
            echo "Built in this repository by \`.github/workflows/cores.yml\` on \`$GITHUB_SHA\`; the same build without \`with_v2ray_api\` was checked byte for byte against the official release binary of each arch."
            echo ""
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo ""
            echo "\`SHA256SUMS.sig\`: ed25519, key \`.github/agent-keys/primary.pub\`."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest=false \
            dist/*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sig
          echo "### $TAG published, not Latest" >> "$GITHUB_STEP_SUMMARY"
