# A panel that is missing exactly one route.
#
# `POST /bandwidth-stats/nodes/users` is the fourth and last of the capability
# routes served in 741d0cd, and the only one no run has ever reached. The shop
# calls it as a FALLBACK: it is tried only when `/bandwidth-stats/nodes/usage`
# is unavailable (tariff_worker_premium_usage.py), and against a facade that
# serves both, the first one always answers. There is no shop-side setting that
# turns the preferred route off - `panel_capability_state` reads only its own
# observations and the version manifest, neither of which is configuration.
#
# But observation is something we can supply. The shop marks a route absent when
# it sees a 404 whose body carries no `errorCode`
# (`panel_api_responses.py::_is_missing_endpoint_response`, transcribed into
# `remnawave.contract.test.ts::readsAsMissingRoute`), and the looser check the
# usage path actually uses wants only the status
# (`panel_api_usage.py::_route_is_unavailable`). So a proxy that answers that
# one path with a router-miss and forwards everything else is a panel build
# without the route, as far as the shop can tell - with neither the shop nor the
# panel modified to arrange it.
#
# That buys two things. The fallback route gets called by a real shop instead of
# by our own inject, and the property the whole facade rests on gets tested for
# once: that our 404 reads to the shop as "this build lacks the route" and it
# degrades cleanly, rather than as an error to retry or a failure to surface.
server {
    listen 8080;
    server_name _;

    client_max_body_size 4m;

    # Matched by SUFFIX, so the facade's configurable prefix (`/rw` by default,
    # `REMNAWAVE_COMPAT_PREFIX`) does not have to be baked in here. A regex
    # location outranks the prefix one below regardless of order, which is what
    # keeps this from depending on how the file is read.
    #
    # `nodes/usage` only. `nodes/users` is a different path and must pass
    # through untouched - it is the route this whole file exists to reach.
    location ~ /api/bandwidth-stats/nodes/usage$ {
        default_type application/json;
        # Byte-for-byte the body our own panel sends for a route it does not
        # have - Fastify's not-found shape, checked against the live facade
        # rather than written from the framework's docs. That matters: the point
        # is a panel of ours MISSING this route, not a third shape the shop has
        # never seen. `$uri` and not `$request_uri` because the router names the
        # path, and the query string here carries the date range.
        #
        # No `errorCode`, and "not found" in the message: those two are what the
        # shop's predicate reads. A 404 that carried an errorCode would say the
        # request failed, not that the route is absent, and the shop would keep
        # asking.
        return 404 '{"message":"Route $request_method:$uri not found","error":"Not Found","statusCode":404}';
    }

    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The facade streams `/users/stream`; buffering it would turn the
        # paged walk the churn probe depends on into one late response.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
