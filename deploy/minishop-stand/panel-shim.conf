# A panel that is missing exactly one route.
#
# `POST /bandwidth-stats/nodes/users` is the fallback of the shop's premium
# usage path: it is tried only when `/bandwidth-stats/nodes/usage` is
# unavailable (tariff_worker_premium_usage.py), and against a facade that serves
# both, the first one always answers. Nothing in the shop's settings turns the
# preferred route off: `panel_capability_state` reads only what the shop has
# OBSERVED and the version manifest.
#
# But observation can be supplied. The shop marks a route absent when it sees a
# 404 whose body carries no error code and says "not found"
# (`panel_api_responses.py::_is_missing_endpoint_response`; the looser
# `panel_api_usage.py::_route_is_unavailable` wants the status alone). So a proxy
# that answers that one path with a router miss and forwards everything else is
# a panel build without the route, as far as the shop can tell, with neither the
# shop nor the panel modified to arrange it.
#
# That buys two things: the fallback route is called by a real shop, and the
# property the facade rests on is tested once, that a 404 of ours reads to the
# shop as "this build lacks the route" and degrades cleanly.
#
# The shim forwards to `panel-front`, the panel's own frontend image the shop
# reaches in every other run, so no panel port is written here and the request
# still crosses that nginx.
server {
    listen 8080;
    server_name _;

    client_max_body_size 4m;

    # Docker's embedded DNS. With a variable in `proxy_pass` nginx resolves the
    # name per request, so a recreated `panel-front` does not leave the shim on a
    # dead address.
    resolver 127.0.0.11 valid=10s;

    # Matched by SUFFIX, so the facade's configurable prefix (`/rw` by default,
    # `REMNAWAVE_COMPAT_PREFIX`) is not baked in here. A regex location outranks
    # the prefix one below regardless of order.
    #
    # `nodes/usage` only. `nodes/users` is a different path and must pass
    # through untouched: it is the route this file exists to reach.
    location ~ /api/bandwidth-stats/nodes/usage$ {
        default_type application/json;
        # The body the panel sends for a route it does not have: Fastify's
        # not-found shape (the panel registers no not-found handler of its own).
        # The point is a panel of ours MISSING this route, not a third shape the
        # shop has never seen. `$uri` and not `$request_uri`, because the router
        # names the path and the query string carries the date range.
        #
        # No `errorCode`, and "not found" in the message: those are what the
        # shop's predicate reads. A 404 that carried an errorCode would say the
        # request failed, not that the route is absent.
        return 404 '{"message":"Route $request_method:$uri not found","error":"Not Found","statusCode":404}';
    }

    location / {
        set $upstream http://panel-front;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The facade streams `/users/stream`; buffering it would turn the paged
        # walk the churn probe depends on into one late response.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
