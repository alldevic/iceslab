# A real TLS reverse proxy in front of the shop's webhook endpoint.
#
# Live-risk (5) in docs/remnawave-compat.md §14: in production the panel does
# not talk to the shop directly, it talks to whatever nginx or CDN the operator
# put in between - and the facade signs an HMAC over the RAW body, so the shop's
# check passes only if the bytes that arrive are the bytes that were signed. The
# stand otherwise speaks plain HTTP host-to-container, which is the one topology
# that cannot show this.
#
# Deliberately plain: no request-body rewriting, no WAF, no `sub_filter`. The
# question is what a CORRECT proxy does, because if the byte stream cannot
# survive that, nothing further needs testing.
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;

    # Bodies are small; buffering them is what a real deployment does, and it is
    # the step that would re-chunk the stream if anything did.
    client_max_body_size 1m;

    location / {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Nothing here touches the signature header. It is spelled with dashes,
        # which is why: nginx drops headers containing underscores by default,
        # and `X_Remnawave_Signature` would arrive as no header at all - a 401
        # the panel would read as a rejected signature rather than a lost one.
    }
}
