---
# Node-agent install via the bootstrap-token installer. GUARDED by main.yml on
# panel_url + bootstrap_token, so it only runs when a panel is reachable. The
# installer builds the agent, drops a systemd unit, writes /etc/iceslab-node/env
# (NODE_PAYLOAD) and starts the service. The bootstrap token is single-use with
# a 15-min TTL.
#
# The script is SHIPPED from this repository, not fetched. It used to be
# `bash <(curl -fsSL {{ iceslab_panel_url }}/install-iceslab-node.sh)`, and the
# panel serves no such route - it answers 404, and the panel's own bootstrap
# command points at raw.githubusercontent.com instead. Worse than a broken URL:
# `curl -fsSL` fails silently, `bash <(...)` on the empty substitution exits 0,
# and the task would have reported success having installed nothing. Which is
# also why this file could carry "not yet exercised end-to-end" for so long -
# it could not be.
#
# Copying it also means the role deploys the installer it was written against,
# rather than whatever is at the tip of a branch somewhere.
- name: Ship the node installer to the node
  ansible.builtin.copy:
    src: "{{ iceslab_installer_src }}"
    dest: /usr/local/sbin/install-iceslab-node.sh
    mode: "0755"

# Say which agent is about to be built, before building it.
#
# The installer's default source is UPSTREAM at a release tag. A fork that
# forgets to set `iceslab_node_repo`/`iceslab_node_ref` gets a node running
# somebody else's agent, and every fork-only endpoint the panel calls then
# answers 404 on a node that is otherwise healthy. That failure is silent in
# both directions - the play is green and the node is up - so the only cheap
# defence is saying it out loud at the moment of the decision.
- name: Report which agent source will be installed
  ansible.builtin.debug:
    msg: >-
      node-agent source:
      {{ iceslab_node_repo | default('', true) | ternary(iceslab_node_repo, 'installer default (UPSTREAM github.com/icecompany-tech/iceslab)') }}
      @
      {{ iceslab_node_ref | default('', true) | ternary(iceslab_node_ref, 'installer default (v0.2.0)') }}

- name: Run the iceslab-node installer (bootstrap flow)
  ansible.builtin.command:
    cmd: >-
      /usr/local/sbin/install-iceslab-node.sh
      --panel-url {{ iceslab_panel_url | quote }}
      --bootstrap {{ iceslab_bootstrap_token | quote }}
      --protocol {{ iceslab_node_protocol | quote }}
      {% if iceslab_singbox_engine | bool %}--with-singbox{% endif %}
      {% if iceslab_harden_ufw | bool %}--harden-ufw{% endif %}
      {% if iceslab_fail2ban | bool %}--fail2ban{% endif %}
      {% if iceslab_ssh_allowlist | length > 0 %}--ssh-allowlist {{ iceslab_ssh_allowlist | join(',') | quote }}{% endif %}
    creates: /etc/iceslab-node/env
  # The installer reads these from the environment and has no flags for them,
  # so this is the only way the role can choose what it deploys. Omitted keys
  # would still shadow the installer's defaults with an empty string, hence the
  # dict comprehension rather than two plain entries.
  environment: >-
    {{
      {}
      | combine({'ICESLAB_NODE_REPO': iceslab_node_repo} if iceslab_node_repo | length > 0 else {})
      | combine({'ICESLAB_NODE_REF': iceslab_node_ref} if iceslab_node_ref | length > 0 else {})
    }}

# Confirm the agent is actually serving before the play calls itself done.
#
# NOT by asking /healthz: the agent requires a verified CLIENT certificate, so a
# request without one dies in the TLS handshake and never reaches an HTTP status
# at all. The task here used to dial https://127.0.0.1:8443/healthz expecting a
# 200 or a 401 - wrong port (the agent moved to 1337 in wave-13) AND a response
# that cannot happen, under failed_when:false so it reported nothing either way.
# A step that cannot pass and cannot fail is worse than no step: the play ends
# green and an operator reads that as confirmation.
#
# What proves it locally, without a client certificate: the socket is open and
# systemd says the unit is running.
- name: Wait for the node-agent to listen
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ iceslab_node_agent_port }}"
    timeout: 60

- name: Confirm the node-agent unit is running
  ansible.builtin.command: systemctl is-active iceslab-node
  register: iceslab_agent_active
  changed_when: false
  failed_when: iceslab_agent_active.stdout.strip() != 'active'
