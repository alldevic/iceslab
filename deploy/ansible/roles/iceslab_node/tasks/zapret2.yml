---
# B2 — provision ss-zapret2 (the docker stack). The panel's /applyEgress
# manager drives it afterwards (it overwrites the strategy `config` and runs
# `docker compose up -d`). Integration is socks-via-container: route blocked
# traffic into ss-zapret2's SOCKS (127.0.0.1:{{ iceslab_zapret2_socks_port }})
# via B1 routingFragments. See deploy/ansible/README.md.
# The stack is docker-compose, so the role installs docker rather than
# demanding it. Asserting instead used to fail the play on any node that did not
# happen to have it, and the way that gets resolved in practice is an operator
# apt-getting it by hand - which is how two nodes stop being the same node.
#
# Package names checked on Debian 13 (trixie), 2026-08-24: `docker.io` plus
# `docker-compose`, which is what provides the compose V2 PLUGIN there
# (`docker compose version` -> 2.26.1). There is no `docker-compose-v2` package
# on trixie, and `docker-compose` is no longer the old Python V1 script.
- name: Install what this stack needs (docker for the compose stack, git for the clone)
  ansible.builtin.apt:
    name: "{{ iceslab_zapret2_prereqs }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - iceslab_zapret2_install_prereqs | bool
    - ansible_facts['os_family'] == 'Debian'

- name: Ensure docker is running
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
  when: iceslab_zapret2_install_prereqs | bool

# Kept as a post-condition, not a precondition: it now says "the thing the role
# just provisioned actually works", and still catches a non-Debian node or an
# operator who set iceslab_zapret2_install_prereqs=false and did not deliver.
- name: Confirm docker compose is usable
  ansible.builtin.command: docker compose version
  register: iceslab_docker_check
  changed_when: false

- name: Clone/update ss-zapret2
  ansible.builtin.git:
    repo: "{{ iceslab_zapret2_repo }}"
    dest: "{{ iceslab_zapret2_dir }}"
    version: "{{ iceslab_zapret2_version }}"
    depth: 1

- name: Render ss-zapret2 .env
  ansible.builtin.template:
    src: zapret2.env.j2
    dest: "{{ iceslab_zapret2_dir }}/.env"
    mode: "0600"
  notify: restart zapret2

- name: Seed the strategy config from upstream default (panel overwrites via /applyEgress)
  ansible.builtin.copy:
    src: "{{ iceslab_zapret2_dir }}/config.default"
    dest: "{{ iceslab_zapret2_dir }}/config"
    remote_src: true
    force: false
    mode: "0644"

- name: Bring up the ss-zapret2 stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ iceslab_zapret2_dir }}"
  register: iceslab_zapret2_up
  changed_when: >-
    ('Started' in iceslab_zapret2_up.stderr) or
    ('Created' in iceslab_zapret2_up.stderr) or
    ('Recreate' in iceslab_zapret2_up.stderr)

# F3 - node-side self-tune scan. The script only writes reports; the agent is
# what applies them (ZAPRET2_TUNE_PATH in the env block below).
- name: Deploy the self-tune script
  ansible.builtin.copy:
    src: iceslab-egress-selftune.sh
    dest: /usr/local/bin/iceslab-egress-selftune.sh
    mode: "0755"
  when: iceslab_zapret2_selftune | bool

- name: Install the self-tune systemd service + timer
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: iceslab-egress-selftune.service.j2, dest: iceslab-egress-selftune.service }
    - { src: iceslab-egress-selftune.timer.j2, dest: iceslab-egress-selftune.timer }
  when: iceslab_zapret2_selftune | bool
  notify: reload systemd

- name: Enable the self-tune timer
  ansible.builtin.systemd_service:
    name: iceslab-egress-selftune.timer
    enabled: true
    state: started
    daemon_reload: true
  when: iceslab_zapret2_selftune | bool
