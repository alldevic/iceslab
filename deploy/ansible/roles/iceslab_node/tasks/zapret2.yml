---
# B2 — provision ss-zapret2 (the docker stack). The panel's /applyEgress
# manager drives it afterwards (it overwrites the strategy `config` and runs
# `docker compose up -d`). Integration is socks-via-container: route blocked
# traffic into ss-zapret2's SOCKS (127.0.0.1:{{ iceslab_zapret2_socks_port }})
# via B1 routingFragments. See deploy/ansible/README.md.
- name: Assert docker is available
  ansible.builtin.command: docker compose version
  register: iceslab_docker_check
  changed_when: false

- name: Clone/update ss-zapret2
  ansible.builtin.git:
    repo: "{{ iceslab_zapret2_repo }}"
    dest: "{{ iceslab_zapret2_dir }}"
    version: "{{ iceslab_zapret2_version }}"
    depth: 1

- name: Render ss-zapret2 .env
  ansible.builtin.template:
    src: zapret2.env.j2
    dest: "{{ iceslab_zapret2_dir }}/.env"
    mode: "0600"
  notify: restart zapret2

- name: Seed the strategy config from upstream default (panel overwrites via /applyEgress)
  ansible.builtin.copy:
    src: "{{ iceslab_zapret2_dir }}/config.default"
    dest: "{{ iceslab_zapret2_dir }}/config"
    remote_src: true
    force: false
    mode: "0644"

- name: Bring up the ss-zapret2 stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ iceslab_zapret2_dir }}"
  register: iceslab_zapret2_up
  changed_when: >-
    ('Started' in iceslab_zapret2_up.stderr) or
    ('Created' in iceslab_zapret2_up.stderr) or
    ('Recreate' in iceslab_zapret2_up.stderr)

# F3 - node-side self-tune scan. The script only writes reports; the agent is
# what applies them (ZAPRET2_TUNE_PATH in the env block below).
- name: Deploy the self-tune script
  ansible.builtin.copy:
    src: iceslab-egress-selftune.sh
    dest: /usr/local/bin/iceslab-egress-selftune.sh
    mode: "0755"
  when: iceslab_zapret2_selftune | bool

- name: Install the self-tune systemd service + timer
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: iceslab-egress-selftune.service.j2, dest: iceslab-egress-selftune.service }
    - { src: iceslab-egress-selftune.timer.j2, dest: iceslab-egress-selftune.timer }
  when: iceslab_zapret2_selftune | bool
  notify: reload systemd

- name: Enable the self-tune timer
  ansible.builtin.systemd_service:
    name: iceslab-egress-selftune.timer
    enabled: true
    state: started
    daemon_reload: true
  when: iceslab_zapret2_selftune | bool

# Wire the node-agent's egress manager to this stack so panel /applyEgress
# pushes can write the strategy config + reload the container. Only when the
# agent is installed (its env file exists). UP_CMD uses --force-recreate so a
# config change actually reloads zapret2.
- name: Check for the node-agent env file
  ansible.builtin.stat:
    path: "{{ iceslab_node_env_file }}"
  register: iceslab_agent_env_stat
  when: iceslab_zapret2_agent_env | bool

- name: Wire ZAPRET2_* into the node-agent env
  ansible.builtin.blockinfile:
    path: "{{ iceslab_node_env_file }}"
    marker: "# {mark} ANSIBLE MANAGED zapret2 egress"
    block: |
      ZAPRET2_CONFIG_PATH={{ iceslab_zapret2_dir }}/config
      ZAPRET2_UP_CMD=docker compose -f {{ iceslab_zapret2_dir }}/docker-compose.yml up -d --force-recreate
      ZAPRET2_DOWN_CMD=docker compose -f {{ iceslab_zapret2_dir }}/docker-compose.yml down
      {% if iceslab_zapret2_selftune | bool %}ZAPRET2_TUNE_PATH={{ iceslab_zapret2_tune_path }}{% endif %}
  when:
    - iceslab_zapret2_agent_env | bool
    - iceslab_agent_env_stat.stat.exists | default(false)
  notify: restart iceslab-node
