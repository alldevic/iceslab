---
# What the play hands to scripts/install-iceslab-node.sh. The role runs that
# script and nothing else: packages, kernel tuning, the cores and their pinned
# versions are the installer's, so a node installed by hand and one installed by
# this role are the same node.

# The panel and the node's single-use bootstrap token (15 min). The token is
# per host: mint it for the node you are installing (README.md).
iceslab_panel_url: ""
iceslab_bootstrap_token: ""

# WHICH agent the installer builds. Required, no default: the installer's own
# default is a release, and a node quietly built from another source answers
# 404 to whatever the panel has and that release has not.
iceslab_node_repo: ""
iceslab_node_ref: ""
# Optional: the commit the ref must resolve to (ICESLAB_NODE_REF_SHA), for a tag
# that must not have moved.
iceslab_node_ref_sha: ""
# ICESLAB_HANDOVER. The installer, asked for a ref other than its own, replaces
# itself with that ref's copy from raw.githubusercontent.com, and stops when the
# repository is not on GitHub. Any non-empty value here skips that: set it when
# the repository is not on GitHub, or when iceslab_installer_src is already the
# installer of iceslab_node_ref. Empty: the installer decides.
iceslab_installer_handover: ""

# The node's cores (--engines). Empty: only the agent goes on, the cores are
# added later from the node page.
iceslab_engines: []

# --harden-ufw and --ssh-allowlist. EMPTY ALLOWLIST MEANS NO RESTRICTION; one
# that does not include where you connect from locks you out.
iceslab_harden_ufw: false
iceslab_ssh_allowlist: []
# --fail2ban: an SSH jail on the node.
iceslab_fail2ban: false
# --ssh-port, passed when it is not 22: the port sshd listens on. Every SSH rule
# of ufw and the fail2ban jail use it. It must be the port sshd really listens
# on, which is also the host's ansible_port in the inventory.
iceslab_ssh_port: 22
# Anything else the installer takes, as it takes it, e.g.
# ["--panel-ip", "203.0.113.5"].
iceslab_installer_extra_args: []

# The agent's mTLS port: --port is passed when it is not the installer's 1337,
# and the play waits for it.
iceslab_node_agent_port: 1337

# The installer copy shipped to the node: the one in this repository.
iceslab_installer_src: "{{ role_path }}/../../../../scripts/install-iceslab-node.sh"
