# Copy to inventory.ini (not committed) and fill in your nodes.
# Key-based SSH only; never put passwords here.
[iceslab_nodes]
# nl-01 ansible_host=203.0.113.10 ansible_user=root iceslab_bootstrap_token=bs_xxx

[iceslab_nodes:vars]
ansible_ssh_private_key_file = ~/.ssh/id_ed25519
iceslab_panel_url = https://panel.example.com
# Which agent to build. Both are required; the play refuses to guess.
iceslab_node_repo = https://github.com/icecompany-tech/iceslab.git
iceslab_node_ref  = v0.3.0-rc.1
# The cores, as the panel's "Create node" command names them.
iceslab_engines = ["xray", "hysteria"]
# iceslab_hysteria_domain = hy2-01.example.com
