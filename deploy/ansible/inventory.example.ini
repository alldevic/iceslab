# Copy to inventory.ini (gitignored) and fill in your nodes.
# Key-based SSH only; never put passwords here.
# The host name must be the node's name in the panel (README.md).
[iceslab_nodes]
# node-01 ansible_host=203.0.113.10 ansible_user=root
# a host whose sshd is not on 22: ansible_port and iceslab_ssh_port are the same number
# node-02 ansible_host=203.0.113.11 ansible_user=root ansible_port=2222 iceslab_ssh_port=2222

[iceslab_nodes:vars]
ansible_ssh_private_key_file = ~/.ssh/id_ed25519
iceslab_panel_url = https://panel.example.com
# The node's single-use token (15 minutes), minted per node; see README.md.
# iceslab_bootstrap_token = bs_xxx
# WHICH agent to install. Both are required; the play refuses to guess.
iceslab_node_repo = https://github.com/alldevic/iceslab.git
iceslab_node_ref  = v0.3.1
# iceslab_engines = ["xray"]
