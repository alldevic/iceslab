# Copy to inventory.ini (gitignored) and fill in your nodes.
# Key-based SSH only; never put passwords here.
[iceslab_nodes]
# rf-exit-01 ansible_host=203.0.113.10 ansible_user=root

[iceslab_nodes:vars]
ansible_ssh_private_key_file = ~/.ssh/id_ed25519
# Enable the B2 zapret2 egress on RF-exit nodes (off by default):
# iceslab_zapret2_enabled = true
# iceslab_zapret2_ss_password = "{{ vault_zapret2_ss_password }}"
#
# To also install the node-agent, set (needs a reachable panel):
# iceslab_panel_url = https://panel.example.com
# iceslab_bootstrap_token = bs_xxx   # single-use, 15-min TTL
#
# ...and say WHICH agent to build. Both are required; the play refuses to guess.
# The installer's own default is UPSTREAM at v0.2.0, which carries none of this
# fork's node-side features - the panel would offer them and the node answer 404.
# iceslab_node_repo = https://github.com/your-org/iceslab.git
# iceslab_node_ref  = v0.2.0-fork.1
